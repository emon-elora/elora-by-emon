<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elora by Emon • Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f2f3;color:#2b2023}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:22px;font-weight:800}.muted{color:#777}.card{background:#fff;border:1px solid #eadde0;border-radius:18px;padding:20px;box-shadow:0 8px 30px #6c4b5210}.login{max-width:430px;margin:12vh auto}.login h1{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dcced2;border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 16px;background:#9c5360;color:white;font-weight:700}.btn.alt{background:#eee;color:#432d33}.btn.danger{background:#8d303d}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab.active{background:#9c5360;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.product,.order{border:1px solid #eadde0;border-radius:14px;padding:14px;background:#fff}.product img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#f2e8ea}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.price{font-weight:800}.status{padding:5px 8px;border-radius:20px;background:#f2e7e9;font-size:12px}.error{color:#a72d3e;margin-top:10px}.ok{color:#237343;margin-top:10px}@media(max-width:700px){.grid,.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div id="login" class="wrap login"><div class="card"><h1>ELORA <small>by Emon</small></h1><p class="muted">Secure Admin Login</p><form id="loginForm"><div class="field"><label>Admin Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Login</button><div id="loginMsg"></div></form></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><div class="brand">ELORA by Emon • Admin</div><div class="muted">Manage products and customer orders</div></div><div class="actions"><a class="btn alt" href="/" target="_blank">View Store</a><button class="btn alt" id="refresh">Refresh</button></div></div>
<div class="tabs"><button class="btn tab active" data-tab="products">Products</button><button class="btn tab" data-tab="orders">Orders</button></div>
<section id="productsTab"><div class="card"><div class="row"><h2>Add Product</h2><span class="muted">Customer site updates from the database</span></div><form id="productForm"><div class="formgrid"><div class="field"><label>Product name</label><input name="name" required></div><div class="field"><label>Price (৳)</label><input name="price" type="number" min="0" required></div><div class="field"><label>Type</label><select name="type"><option>Fashion</option><option>Beauty</option></select></div><div class="field"><label>Category</label><select name="cat"><option value="fashion">Fashion</option><option value="beauty">Beauty</option></select></div><div class="field"><label>Badge</label><input name="badge" value="NEW"></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" value="10"></div><div class="field full"><label>Image URL</label><input name="image_url" placeholder="https://...jpg"></div><div class="field full"><label>Description</label><textarea name="description" rows="3"></textarea></div></div><button class="btn" type="submit">Add Product</button><div id="productMsg"></div></form></div><div style="height:18px"></div><div id="productList" class="grid"></div></section>
<section id="ordersTab" class="hidden"><div id="orderList" class="grid"></div></section></div><script>
const $=s=>document.querySelector(s);let products=[];let orders=[];
function msg(el,t,good=false){el.textContent=t;el.className=good?'ok':'error';setTimeout(()=>el.textContent='',2500)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}catch(x){msg($('#loginMsg'),x.message)}};
async function load(){try{products=(await api('/api/admin/products')).products;orders=(await api('/api/admin/orders')).orders;renderProducts();renderOrders()}catch(x){if(x.message==='Unauthorized'){location.reload()}else alert(x.message)}}
function renderProducts(){ $('#productList').innerHTML=products.map(p=>`<article class="product"><img src="${p.image_url||'elora-logo.jpg'}" onerror="this.src='elora-logo.jpg'"><h3>${esc(p.name)}</h3><div class="row"><span class="price">৳ ${Number(p.price).toLocaleString('en-BD')}</span><span class="status">Stock: ${p.stock}</span></div><p class="muted">${esc(p.description||'')}</p><div class="actions"><button class="btn alt" onclick="editProduct(${p.id})">Edit</button><button class="btn danger" onclick="delProduct(${p.id})">Delete</button></div></article>`).join('')||'<div class="card">No products yet.</div>' }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#productForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/admin/products',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});e.target.reset();msg($('#productMsg'),'Product added',true);load()}catch(x){msg($('#productMsg'),x.message)}};
window.editProduct=async id=>{const p=products.find(x=>x.id===id);const name=prompt('Product name',p.name);if(name===null)return;const price=prompt('Price',p.price);const stock=prompt('Stock',p.stock);const image=prompt('Image URL',p.image_url||'');const description=prompt('Description',p.description||'');try{await api('/api/admin/products',{method:'PATCH',body:JSON.stringify({...p,name,price,stock,image_url:image,active:p.active})});load()}catch(x){alert(x.message)}};
window.delProduct=async id=>{if(!confirm('Delete this product?'))return;try{await api('/api/admin/products',{method:'DELETE',body:JSON.stringify({id})});load()}catch(x){alert(x.message)}};
function renderOrders(){$('#orderList').innerHTML=orders.map(o=>`<article class="order"><div class="row"><h3>Order #${o.id}</h3><span class="status">${o.status}</span></div><p><b>${esc(o.customer_name)}</b><br>${esc(o.phone)}<br>${esc(o.address)}</p><p>${o.items.map(i=>`${esc(i.name)} × ${i.qty} — ৳ ${Number(i.price*i.qty).toLocaleString('en-BD')}`).join('<br>')}</p><div class="row"><b>Total: ৳ ${Number(o.total).toLocaleString('en-BD')}</b><select onchange="statusOrder(${o.id},this.value)">${['pending','confirmed','packed','shipped','delivered','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div></article>`).join('')||'<div class="card">No orders yet.</div>'}
window.statusOrder=async(id,status)=>{try{await api('/api/admin/orders',{method:'PATCH',body:JSON.stringify({id,status})});load()}catch(x){alert(x.message)}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#productsTab').classList.toggle('hidden',b.dataset.tab!=='products');$('#ordersTab').classList.toggle('hidden',b.dataset.tab!=='orders')});$('#refresh').onclick=load;
</script></body></html>
